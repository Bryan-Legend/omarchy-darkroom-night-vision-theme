# Darkroom Night Vision
# Red-only palette for darkrooms and dark-adapted eyes. Every color keeps its
# green and blue channels at 00, so the screen only ever emits red light.
# Hierarchy comes from brightness alone; nothing gets close to full white.
mode = "dark"

accent = "#e40000"
selection = "#5b0000"
# Selected text is inverted: black on red, so it stands out on the black background.
selection_background = "#c70000"
selection_foreground = "#000000"
muted = "#a00000"

background = "#000000"
dark_background = "#180000"
darker_background = "#000000"
lighter_background = "#370000"

foreground = "#c70000"
dark_foreground = "#a00000"
light_foreground = "#b90000"
bright_foreground = "#df0000"

hyprland_active_border = "rgba(d70000ee) rgba(8e0000ee) 45deg"
hyprland_inactive_border = "rgba(560000aa)"

red = "#ec0000"
yellow = "#d20000"
orange = "#dc0000"
green = "#be0000"
cyan = "#b20000"
blue = "#a90000"
magenta = "#c90000"
brown = "#750000"

bright_red = "#ff0000"
bright_yellow = "#e90000"
bright_green = "#d70000"
bright_cyan = "#cc0000"
bright_blue = "#c40000"
bright_magenta = "#df0000"
